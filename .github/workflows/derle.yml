name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Zipi ac
        run: |
          unzip -o SinifSistemi-duzeltilmis.zip
          mv SinifSistemi/* . 2>/dev/null || true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: Derle
        run: gradle build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: SinifSistemi
          path: build/libs/*.jar
