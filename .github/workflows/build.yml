name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Zipi ac
        run: |
          for z in *.zip; do
            [ -e "$z" ] || continue
            echo "aciliyor: $z"
            unzip -o "$z"
          done
          echo "--- pom.xml nerede ---"
          find . -name pom.xml -not -path './.git/*'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Derle
        run: |
          DIR=$(dirname "$(find . -name pom.xml -not -path './.git/*' | head -1)")
          echo "proje klasoru: $DIR"
          cd "$DIR"
          mvn -B package

      - uses: actions/upload-artifact@v4
        with:
          name: SinifSistemi
          path: '**/target/*.jar'
