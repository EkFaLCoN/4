# ============================================================
#   SINIF SISTEMI - Ayar Dosyasi
#   Tum renkler MiniMessage formatindadir: <red>, <gradient:#ff0000:#ffaa00>
# ============================================================

ayarlar:
  # Oyuncu sunucuda sinifini yalnizca 1 KERE secebilir.
  # false yapilirsa herkes /sinif ile istedigi zaman degistirebilir.
  bir-kere-secim: true

  # Sinifi olmayan oyuncu giris yapinca menu otomatik acilsin mi?
  giriste-menu-ac: true

  # Menunun kac tick sonra acilacagi (20 tick = 1 saniye)
  giris-menu-gecikmesi: 40

  # Sinif secmeyen oyuncu menuyu ESC ile kapatabilsin mi?
  # false = menu tekrar acilir (secim zorunlu olur)
  menu-kapatilabilir: false

  # Sinif degistiginde envanter icin uyari mesaji gosterilsin mi
  pasif-yetenek-bildirimi: true

menu:
  baslik: "<dark_gray>» <gradient:#FFD200:#FF8A00><bold>SINIFINI SEÇ</bold></gradient> <dark_gray>«"
  satir-sayisi: 5
  dolgu-materyali: BLACK_STAINED_GLASS_PANE
  # Menuye tiklama sesi
  secim-sesi: ENTITY_PLAYER_LEVELUP
  hover-sesi: UI_BUTTON_CLICK

# ------------------------------------------------------------
#  Siniflarin pasif yetenek degerleri
# ------------------------------------------------------------
siniflar:
  savasci:
    ek-can: 4              # 4 = 2 ekstra kalp
    direnc-seviyesi: 0     # 0 = Direnç I, -1 = kapali
    yakin-dovus-carpani: 1.20
    alinan-ok-hasari-carpani: 0.85

  suikastci:
    hiz-seviyesi: 0        # 0 = Hız I, -1 = kapali
    kilic-hasar-carpani: 1.25
    arkadan-vurus-carpani: 1.60
    alinan-hasar-carpani: 1.10

  rahip:
    yenilenme-seviyesi: 0  # 0 = Yenilenme I, -1 = kapali
    alinan-sifa-carpani: 1.50
    aura-menzili: 6.0      # bu yaricapta yakindaki oyunculara sifa aurasi
    aura-seviyesi: 0
    yakin-dovus-carpani: 0.85

  okcu:
    ok-hasar-carpani: 1.35
    yay-tutarken-hiz-seviyesi: 0
    dusme-hasari-muafiyeti: true
    yakin-dovus-carpani: 0.90

  buyucu:
    sihir-hasari-direnci: 0.50   # buyu/iksir hasarinin %50'si
    gece-gorusu: true
    iksir-hasar-carpani: 1.40
    ek-can: -2                    # 1 kalp daha az (kirilgan)

# ------------------------------------------------------------
#  OZEL SILAHLAR
# ------------------------------------------------------------
silahlar:
  # Silahi elinde tutarken kan damlama parcaciklari
  kan-damlama-efekti: true
  # Yanlis siniftaki oyuncunun elinden silah otomatik cikarilsin mi
  yanlis-sinifta-elden-cikar: true

  kanli_savas_baltasi:
    hasar-carpani: 1.30
    kanama-suresi: 4          # saniye
    kanama-hasari: 1.0        # saniyede yarim kalp
    can-emis-orani: 0.35      # kanama hasarinin %35'i cana doner
    yetenek-bekleme: 20       # saniye
    yetenek-menzili: 4.5
    yetenek-kanama-suresi: 5

# ------------------------------------------------------------
#  MESAJLAR
# ------------------------------------------------------------
mesajlar:
  onek: "<dark_gray>[<gradient:#FFD200:#FF8A00>Sınıf</gradient><dark_gray>] <gray>"

  sadece-oyuncu: "<red>Bu komut yalnızca oyun içinden kullanılabilir."
  yetkin-yok: "<red>Bunu yapmak için yetkin yok."
  oyuncu-bulunamadi: "<red>«<white><oyuncu><red>» adında bir oyuncu bulunamadı."
  sinif-bulunamadi: "<red>«<white><sinif><red>» adında bir sınıf yok. Geçerli sınıflar: <yellow>savasci, suikastci, rahip, okcu, buyucu"

  secim-basarili: "<green>Artık bir <sinif> <green>oldun! Yolun açık olsun."
  secim-uyarisi: "<yellow>Dikkat: Bu seçim <red><bold>kalıcıdır<yellow> ve sunucuda yalnızca <red>bir kez<yellow> yapılabilir."
  zaten-sinifin-var: "<red>Zaten bir sınıfın var: <sinif><red>. Sınıfını değiştirmek için bir yetkiliyle görüşmelisin."
  sinifin-yok: "<yellow>Henüz bir sınıfın yok! <gold>/sinif <yellow>yazarak sınıfını seçebilirsin."
  hosgeldin-sinifsiz: "<gold>Maceraya başlamadan önce bir sınıf seçmelisin!"
  menu-zorunlu: "<red>Devam etmek için önce bir sınıf seçmelisin."

  bilgi-baslik: "<dark_gray><strikethrough>                                        "
  bilgi-satir: "<gray>Sınıfın: <sinif>"
  bilgi-tarih: "<gray>Seçim tarihi: <white><tarih>"

  yonetim-verildi: "<green><oyuncu> <gray>adlı oyuncuya <sinif> <gray>sınıfı verildi."
  yonetim-verildi-hedef: "<gray>Bir yetkili sınıfını <sinif> <gray>olarak değiştirdi."
  yonetim-sifirlandi: "<green><oyuncu> <gray>adlı oyuncunun sınıfı sıfırlandı."
  yonetim-sifirlandi-hedef: "<yellow>Sınıfın sıfırlandı. Yeniden seçim yapabilirsin."
  yonetim-sinifsiz: "<gray><oyuncu> <gray>adlı oyuncunun henüz bir sınıfı yok."
  yonetim-menu-acildi: "<green><oyuncu> <gray>adlı oyuncuya sınıf menüsü açıldı."
  yonetim-yenilendi: "<green>Ayarlar ve mesajlar yeniden yüklendi."

  silah-bulunamadi: "<red>«<white><silah><red>» adında bir özel silah yok. <gray>/silah liste"
  silah-verildi: "<green><oyuncu> <gray>adlı oyuncuya <silah> <gray>verildi."
  silah-alindi: "<gray>Envanterine <silah> <gray>eklendi."
  silah-sinif-uyusmuyor: "<red>Bu silahı yalnızca <sinif> <red>sınıfı kullanabilir. Elin bu ağırlığı taşımıyor."
  yetenek-bekleme: "<red>Bu yetenek henüz hazır değil. <white><saniye> saniye <red>daha beklemelisin."
  kan-cagrisi: "<dark_red><bold>KAN ÇAĞRISI! <gray>Çevrende <white><sayi> <gray>hedef kanıyor."
  kullanim-silah: |-
    <dark_gray><strikethrough>                                        
    <gold><bold>ÖZEL SİLAHLAR
    <yellow>/silah ver <silah> [oyuncu] <dark_gray>- <gray>Silah ver
    <yellow>/silah liste <dark_gray>- <gray>Tüm özel silahları listele
    <dark_gray><strikethrough>                                        

  kullanim-sinif: "<gray>Kullanım: <yellow>/sinif <dark_gray>| <yellow>/sinif bilgi <dark_gray>| <yellow>/sinif liste"
  kullanim-yonetim: |-
    <dark_gray><strikethrough>                                        
    <gold><bold>SINIF YÖNETİMİ
    <yellow>/sinifyonetim ver <oyuncu> <sınıf> <dark_gray>- <gray>Sınıf ver
    <yellow>/sinifyonetim sifirla <oyuncu> <dark_gray>- <gray>Sınıfı sil
    <yellow>/sinifyonetim bilgi <oyuncu> <dark_gray>- <gray>Sınıfı görüntüle
    <yellow>/sinifyonetim menu <oyuncu> <dark_gray>- <gray>Seçim menüsünü aç
    <yellow>/sinifyonetim yenile <dark_gray>- <gray>Ayarları yenile
    <dark_gray><strikethrough>                                        

menu-metinleri:
  sec-butonu: "<green><bold>» SEÇMEK İÇİN TIKLA «"
  kilitli-butonu: "<red><bold>» ZATEN BİR SINIFIN VAR «"
  mevcut-sinif: "<green><bold>» MEVCUT SINIFIN «"
  ozellik-basligi: "<gold><bold>Yetenekler"
  uyari-satiri: "<dark_red>Bu seçim geri alınamaz!"
