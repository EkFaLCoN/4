# ============================================================
#   SINIF SISTEMI - Ayar Dosyasi
#   Tum renkler MiniMessage formatindadir: <red>, <gradient:#ff0000:#ffaa00>
# ============================================================

ayarlar:
  # Oyuncu sunucuda sinifini yalnizca 1 KERE secebilir.
  # false yapilirsa herkes /sinif ile istedigi zaman degistirebilir.
  bir-kere-secim: true

  # Sinifi olmayan oyuncu giris yapinca menu otomatik acilsin mi?
  giriste-menu-ac: true

  # Menunun kac tick sonra acilacagi (20 tick = 1 saniye)
  giris-menu-gecikmesi: 40

  # Sinif secmeyen oyuncu menuyu ESC ile kapatabilsin mi?
  # false = menu ZORUNLUDUR. Kapatilirsa aninda geri acilir ve ayrica bir
  # denetim gorevi sinifsiz oyuncunun menusunu surekli onune getirir.
  # Sadece "sinif.menu.muaf" izni olanlar bu zorunluluktan muaftir.
  menu-kapatilabilir: false

  # Zorunlu menu denetiminin kac tickte bir calisacagi (20 tick = 1 saniye)
  menu-denetim-araligi: 20

  # Sinif degistiginde envanter icin uyari mesaji gosterilsin mi
  pasif-yetenek-bildirimi: true

menu:
  baslik: "<dark_gray>» <gradient:#FFD200:#FF8A00><bold>SINIFINI SEÇ</bold></gradient> <dark_gray>«"
  satir-sayisi: 5
  dolgu-materyali: BLACK_STAINED_GLASS_PANE
  # Menuye tiklama sesi
  secim-sesi: ENTITY_PLAYER_LEVELUP
  hover-sesi: UI_BUTTON_CLICK

# ------------------------------------------------------------
#  Siniflarin pasif ozellikleri
#  Kalici ozellikler POTION EFFECT ile degil, ATTRIBUTE MODIFIER ile verilir.
#  Ekranda efekt ikonu cikmaz, sure dolmaz, icilen iksirlerle catismaz.
#
#  "-yuzde" ile biten degerler oransaldir: 0.20 = %20
#  Diger degerler dogrudan eklenir: max-can 4.0 = +2 kalp, zirh 4.0 = +2 zirh
# ------------------------------------------------------------
siniflar:
  savasci:
    max-can: 4.0                    # +2 kalp
    zirh: 4.0                       # Direnc I'in attribute karsiligi
    saldiri-hasari-yuzde: 0.20      # yakin dovuste %20 fazla hasar
    alinan-ok-hasari-carpani: 0.85  # oklardan %15 az hasar (olay tabanli)

  suikastci:
    hareket-hizi-yuzde: 0.20        # Hiz I'in attribute karsiligi
    kilic-hasar-carpani: 1.25       # kilicla vurusta (olay tabanli)
    arkadan-vurus-carpani: 1.60     # arkadan vurusta (olay tabanli)
    alinan-hasar-carpani: 1.10      # %10 fazla hasar alir (olay tabanli)

  rahip:
    can-yenileme: 1.0               # Yenilenme I yerine: 2 saniyede yarim kalp
    aura-menzili: 6.0               # bu yaricaptaki oyuncular da iyilesir
    aura-yenileme: 0.5
    alinan-sifa-carpani: 1.50       # aldigi sifa %50 guclu (olay tabanli)
    yakin-dovus-carpani: 0.85       # yakin dovusu zayif (olay tabanli)

  okcu:
    yay-tutarken-hiz-yuzde: 0.20    # SADECE yay/arbalet tutarken uygulanir
    ok-hasar-carpani: 1.35          # ok hasari (olay tabanli)
    dusme-hasari-muafiyeti: true
    yakin-dovus-carpani: 0.90       # yakin dovusu zayif (olay tabanli)

  buyucu:
    max-can: -2.0                   # -1 kalp (kirilgan beden)
    gece-gorusu: true               # attribute karsiligi olmadigi icin tek
                                    # istisna olarak potion effect kullanir
    sihir-hasari-direnci: 0.50      # buyu/iksir hasarina direnc (olay tabanli)
    iksir-hasar-carpani: 1.40       # attigi iksirler guclu (olay tabanli)

  avci:
    max-can: 2.0                    # +1 kalp
    zirh: 1.0
    saldiri-hizi-yuzde: 0.15        # mizragin yavas temposunu telafi eder
    hareket-hizi-yuzde: 0.08
    etkilesim-menzili: 0.5
    # Her tur mizrak: _SPEAR ile biten tum esyalar VE uc disli mizrak (trident).
    # Firlatilan uc disli mizrak da ayni bonusu alir.
    mizrak-hasar-carpani: 1.30
    diger-silah-carpani: 0.85       # mizrak disi silahlarla zayif

# ------------------------------------------------------------
#  OZEL SILAHLAR
# ------------------------------------------------------------
silahlar:
  # Silahi elinde tutarken kan damlama parcaciklari
  kan-damlama-efekti: true
  # Yanlis siniftaki oyuncunun elinden silah otomatik cikarilsin mi
  yanlis-sinifta-elden-cikar: true

  kanli_savas_baltasi:
    hasar-carpani: 1.30
    kanama-suresi: 4          # saniye
    kanama-hasari: 1.0        # saniyede yarim kalp
    can-emis-orani: 0.35      # kanama hasarinin %35'i cana doner
    yetenek-bekleme: 20       # saniye
    yetenek-menzili: 4.5
    yetenek-kanama-suresi: 5
    yetenek-guc-yuzde: 0.25   # yetenek sonrasi gecici saldiri gucu (%25)
    yetenek-guc-suresi: 5     # saniye

